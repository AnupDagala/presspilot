name: verify
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: npm }
      - uses: actions/setup-go@v5
        with:
          {
            go-version-file: apps/api/go.mod,
            cache-dependency-path: apps/api/go.sum,
          }
      - run: npm ci
      - name: Redacted source-history secret scan
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1 && "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
      - run: npm run build && npm run typecheck && npm run lint && npm test && npm run scan && npm audit --audit-level=high
      - run: node scripts/init-dev.mjs && docker compose config --quiet && docker compose up -d --build
      - name: Wait for actual API
        run: for i in $(seq 1 60); do curl --fail http://localhost:8080/healthz && exit 0; sleep 2; done; exit 1
      - name: PostgreSQL invariant tests
        working-directory: apps/api
        run: go test -v ./... && go vet ./... && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        env:
          { TEST_DATABASE_URL_FILE: "../../runtime/secrets/test-database-url" }
      - name: Real PostgreSQL and Temporal evaluations
        run: npm run eval
        env:
          {
            WORKER_SECRET_FILE: "runtime/secrets/worker-secret",
            TEST_DATABASE_URL_FILE: "runtime/secrets/test-database-url",
          }
      - name: Mocked provider and private fixture evaluations
        run: npm run eval
        env:
          {
            EVAL_MODE: mocked,
            EVAL_PRIVATE_FIXTURES: "true",
            WORKER_SECRET_FILE: "runtime/secrets/worker-secret",
            TEST_DATABASE_URL_FILE: "runtime/secrets/test-database-url",
          }
      - name: Worker process crash recovery
        run: npx tsx tests/recovery-process.ts
        env:
          {
            WORKER_SECRET_FILE: "runtime/secrets/worker-secret",
            TEST_DATABASE_URL_FILE: "runtime/secrets/test-database-url",
          }
      - run: npx playwright install --with-deps chromium && npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          {
            name: verification,
            path: "evaluations/results-*.json\ntest-results/",
          }
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check && terraform init -backend=false && terraform validate
        working-directory: infra
