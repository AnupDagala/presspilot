scalar JSON
type Query { snapshot: JSON! }
input SubmitCaseInput { orderId: ID!, message: String!, mode: String!, idempotencyKey: String! }
input DecisionInput { proposalId: ID!, binding: String!, decision: String!, idempotencyKey: String! }
type Mutation {
 submitCase(input: SubmitCaseInput!): JSON!
 decideProposal(input: DecisionInput!): JSON!
 simulateProduction(orderId: ID!): JSON!
 updatePolicy(policy: JSON!): JSON!
}
